<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adrien Buffin Games</title><meta name="description" content="Mobile games by Adrien Buffin, an independent developer on the Gold Coast, Australia.">
<link rel="icon" href="mandala-pop/icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1d1a16;--muted:#6f675c;--card:#fff;--line:#e3ddd1}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--ink:#f1ece4;--muted:#a59c8f;--card:#1f1c19;--line:#2e2a25}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:17px/1.55 'Bricolage Grotesque',system-ui,sans-serif;padding:0 16px 60px}
.wrap{max-width:860px;margin:0 auto}
header{padding:56px 0 34px}h1{font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-1.5px}
header p{color:var(--muted);margin-top:14px;max-width:34ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.g{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .15s}
.g:hover{transform:translateY(-3px)}.g img{width:100%;display:block;aspect-ratio:1024/500;object-fit:cover}
.g div{padding:16px 18px 18px}.g b{font-size:22px;font-weight:800}.g span{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.g em{display:inline-block;margin-top:10px;font-style:normal;font-weight:500;font-size:14px;border-bottom:2px solid currentColor}
footer{margin-top:48px;color:var(--muted);font-size:14px}footer a{color:inherit}
</style></head><body><div class="wrap">
<header><h1>Adrien Buffin<br>Games</h1><p>Small, polished mobile games made on the Gold Coast, Australia.</p></header>
<div class="grid">
<a class="g" href="mandala-pop/"><img src="mandala-pop/banner.png" alt="Mandala Pop"><div><b>Mandala Pop</b><span>Bubble shooter with cute pals and a dream garden.</span><em>Privacy &amp; support</em></div></a>
<a class="g" href="lumen-deep/"><img src="lumen-deep/banner.png" alt="Lumen Deep"><div><b>Lumen Deep</b><span>Deep-sea survival. Your lamp is your weapon.</span><em>Privacy &amp; support</em></div></a>
</div>
<footer>Contact: <a href="mailto:mandalapop.support@gmail.com">mandalapop.support@gmail.com</a></footer>
</div></body></html>
